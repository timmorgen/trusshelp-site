<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Industry News | TrussHelp</title>
  <meta name="description" content="Industry news and updates related to wood trusses and structural building components.">

  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <div id="site-header"></div>

  <main class="container">
    <h1>Industry News</h1>

    <p>
      Curated news and updates relevant to the structural building
      component and wood truss industry.
    </p>

    <ul class="news-list">

      <li class="news-item" data-date="2026-02-01">
        <div class="news-date">February 2026</div>
        <a href="/news/2026-02-truss-wind-repair/">
          Advances in truss repair guidance following severe wind events
        </a>
      </li>

      <li class="news-item" data-date="2026-01-01">
        <div class="news-date">January 2026</div>
        <a href="/news/2026-01-plate-truss-updates/">
          Updates from industry associations on metal plate connected wood trusses
        </a>
      </li>

    </ul>
  </main>

  <div id="site-footer"></div>

  <script src="/scripts/include.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const list = document.querySelector(".news-list");
      const items = Array.from(list.children);

      items
        .sort((a, b) => new Date(b.dataset.date) - new Date(a.dataset.date))
        .forEach(item => list.appendChild(item));
    });
  </script>

</body>
</html>
