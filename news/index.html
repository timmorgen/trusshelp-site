<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Industry News</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; max-width: 1100px; margin: 0 auto; padding: 20px; }
    h1 { margin-bottom: 10px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .controls select, .controls input { padding: 6px; }
    .news-item { border-bottom: 1px solid #ddd; padding: 16px 0; }
    .headline { font-size: 1.1em; font-weight: bold; }
    .meta { font-size: 0.85em; color: #666; margin-top: 4px; }
    .meta a { margin-left: 6px; }
  </style>
</head>
<body>

<h1>Industry News</h1>

<div class="controls">
  <select id="sourceFilter">
    <option value="">All Sources</option>
  </select>

  <select id="entityFilter">
    <option value="">All Entities</option>
  </select>

  <select id="topicFilter">
    <option value="">All Topics</option>
  </select>

  <input type="text" id="searchInput" placeholder="Search headlines or excerpts">
</div>

<div id="newsContainer"></div>

<script src="news.js"></script>
</body>
</html>
